# Backend-only production compose for Coolify.
#
# Frontend is deployed separately from apps/web/Dockerfile.
# Backend services share one image tag so Compose / BuildKit builds and exports once
# instead of repeating the same backend image for each worker.
services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        image: prospect-shortlisting-backend:${IMAGE_TAG:-latest}
        env_file:
            - .env
        command: >
            sh -c "uv run alembic upgrade head &&
                   uv run python scripts/apply_procrastinate_schema_maybe.py &&
                   uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS http://127.0.0.1:8000/v1/health/live >/dev/null || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s

    worker-scrape:
        image: prospect-shortlisting-backend:${IMAGE_TAG:-latest}
        env_file:
            - .env
        depends_on:
            api:
                condition: service_healthy
        command:
            - "./scripts/run_worker.sh"
            - "scrape"
            - "2"
        restart: unless-stopped

    worker-ai:
        image: prospect-shortlisting-backend:${IMAGE_TAG:-latest}
        env_file:
            - .env
        depends_on:
            api:
                condition: service_healthy
        command:
            - "./scripts/run_worker.sh"
            - "ai_decision"
            - "2"
        restart: unless-stopped

    worker-provider:
        image: prospect-shortlisting-backend:${IMAGE_TAG:-latest}
        env_file:
            - .env
        depends_on:
            api:
                condition: service_healthy
        command:
            - "./scripts/run_worker.sh"
            - "contact_fetch"
            - "1"
        restart: unless-stopped

    worker-validation:
        image: prospect-shortlisting-backend:${IMAGE_TAG:-latest}
        env_file:
            - .env
        depends_on:
            api:
                condition: service_healthy
        command:
            - "./scripts/run_worker.sh"
            - "validation"
            - "1"
        restart: unless-stopped
